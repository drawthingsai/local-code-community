<svg xmlns="http://www.w3.org/2000/svg" width="760" height="304" viewBox="0 0 760 304" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Decode speed without and with the draft model, M5 Max (128 GB)</title>
<desc id="desc">Decode speed in tokens per second with 32K tokens already in context, averaged over eight tasks, without and with the draft model. Higher is better. DeepSeek 4.1 Flash 1017 (2-bit S): 22.6 without, 24.8 with (1.09 times); Inkling 2 Small (2-bit S): 17.9 without, 16.7 with (0.93 times); Inkling 2 Mini (3-bit S): 61.1 without, 70.8 with (1.16 times).</desc>
