<svg xmlns="http://www.w3.org/2000/svg" width="760" height="404" viewBox="0 0 760 404" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif' role="img" aria-labelledby="title desc">
<title id="title">Decode speed without and with the draft model, M5 Ultra (256 GB)</title>
<desc id="desc">Decode speed in tokens per second with 32K tokens already in context, averaged over eight tasks, without and with the draft model. Higher is better. DeepSeek 4.1 Flash 1017 (2-bit S): 54.7 without, 76.4 with (1.40 times); GLM 5.3 Flash (4-bit S): 54.7 without, 73.8 with (1.35 times); Inkling 2 Small (2-bit S): 51.8 without, 66.5 with (1.28 times); Inkling 2 Mini (3-bit S): 79.9 without, 102.3 with (1.28 times); Inkling 2 Mini (4-bit S): 77.9 without, 102.4 with (1.31 times).</desc>
<rect x="0.5" y="0.5" width="759" height="403" rx="12" fill="#fcfcfb" stroke="rgba(11,11,11,0.10)"/>
