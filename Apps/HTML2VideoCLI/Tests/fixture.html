<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 640px; height: 360px; overflow: hidden; background: #182030; color: white; font: 16px sans-serif; }
  #bits { position: absolute; top: 0; left: 0; display: flex; }
  #bits div { width: 20px; height: 20px; }
  #dom, canvas { position: absolute; top: 50px; width: 100px; height: 100px; }
  #dom { left: 20px; }
  #canvas { left: 140px; }
  #gl { left: 260px; }
  #moving { position: absolute; top: 210px; width: 20px; height: 20px; background: white; }
  #waapi { position: absolute; top: 250px; left: 20px; width: 20px; height: 20px; background: #ff8000; }
  #caption { position: absolute; left: 20px; top: 300px; }
  svg { position: absolute; left: 380px; top: 50px; }
</style>
<div id="bits"></div><div id="dom"></div>
<canvas id="canvas" width="100" height="100"></canvas>
<canvas id="gl" width="100" height="100"></canvas>
<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="#ff8000"/></svg>
<div id="moving"></div><div id="waapi"></div><div id="caption"></div>
<script>
  // Deliberately independent of HyperFrames: isolates the native capture boundary.
  const bits = document.querySelector('#bits');
  for (let i = 0; i < 9; i++) bits.appendChild(document.createElement('div'));
  const context = document.querySelector('#canvas').getContext('2d');
  const gl = document.querySelector('#gl').getContext('webgl', {preserveDrawingBuffer: true});
  const animation = document.querySelector('#waapi').animate(
    [{transform: 'translateX(0px)'}, {transform: 'translateX(299px)'}],
    {duration: 10000, fill: 'both', easing: 'linear'});
  animation.pause();
  window.probeSeek = async function(frame, waitForAnimationFrames) {
    await document.fonts.ready;
    [...bits.children].forEach((bit, i) => bit.style.background = frame & (1 << i) ? '#fff' : '#000');
    document.querySelector('#dom').style.background = frame % 2 ? '#00ff00' : '#ff0000';
    context.fillStyle = frame % 2 ? '#ff00ff' : '#0000ff';
    context.fillRect(0, 0, 100, 100);
    if (gl) {
      gl.clearColor(frame % 2 ? 0 : 1, 1, frame % 2 ? 1 : 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.finish();
    }
    document.querySelector('#moving').style.transform = `translateX(${20 + frame}px)`;
    animation.currentTime = frame / 30 * 1000;
    document.querySelector('#caption').textContent = `Frame ${frame} • DOM / Canvas / WebGL / SVG / WAAPI`;
    if (waitForAnimationFrames) {
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    }
    return {frame, webgl: !!gl, dpr: devicePixelRatio};
  };
</script>

<script>
window.html2video = {width: 640, height: 360, duration: 10,
  seek: seconds => probeSeek(Math.round(seconds * 30), false)};
</script>
